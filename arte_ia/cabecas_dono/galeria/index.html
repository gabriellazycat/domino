<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabeças do Dono</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #f3efe8; --card: #fffdf9; --ink: #2a2420; --muted: #7a6f66; --line: #e2d9cc;
    --accent: #a8322a; --stage-light: #e9e4dc; --stage-dark: #120d0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #171311; --card: #211b18; --ink: #efe7dd; --muted: #a39686; --line: #3a302a; --accent: #e0675b; --stage-light: #2b2420; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: .01em; }
  .sub { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar button, .bar select { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .count { color: var(--muted); margin-left: auto; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 16px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .row h2 { margin: 2px 4px 10px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .row h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .cell { position: relative; border-radius: 10px; overflow: hidden; background: var(--stage-light); border: 1px solid var(--line); }
  .cell img, .cell model-viewer { display: block; width: 100%; aspect-ratio: 1; }
  .cell img { object-fit: cover; }
  .cell model-viewer { height: auto; --poster-color: transparent; }
  body.dark .cell model-viewer { background: radial-gradient(circle at 50% 35%, #3a2418 0%, var(--stage-dark) 70%); }
  .cap { display: flex; justify-content: space-between; gap: 6px; padding: 6px 8px; font-size: 12.5px; color: var(--muted); background: var(--card); border-top: 1px solid var(--line); }
  .cap b { color: var(--ink); font-weight: 600; }
  .star { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 999px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; background: rgba(255,255,255,.85); color: #8a8077; }
  .star[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .empty { color: var(--muted); padding: 18px; text-align: center; font-size: 13px; display: grid; place-items: center; aspect-ratio: 1; }
  #favs { white-space: pre-wrap; font: 12px/1.4 ui-monospace, Consolas, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: none; max-width: 1400px; margin: 8px auto; }
</style>
</head>
<body>
<header>
  <h1>Cabeças do dono da mesa: teste IA → 3D</h1>
  <p class="sub">Cada linha é um concept 2D gerado no seu PC e as cabeças 3D feitas a partir dele. Arraste para girar e use a roda do mouse para dar zoom. A ★ marca as favoritas, que ficam salvas neste navegador.</p>
  <div class="bar">
    <button id="dark" aria-pressed="false">Fundo do jogo (escuro)</button>
    <select id="filtro" aria-label="Filtrar">
      <option value="">Todos os estilos</option>
    </select>
    <button id="soFav" aria-pressed="false">Só favoritas</button>
    <button id="copiar">Listar favoritas</button>
    <span class="count" id="count"></span>
  </div>
</header>
<pre id="favs"></pre>
<main id="list"></main>
<script>
const KEY = 'domino-cabecas-favs';
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...favs])); } catch (e) {} };
const NAMES = { entalhado: 'Entalhado', rachado: 'Rachado (macabro)', marionete: 'Marionete rústica', cavalheiro: 'Cavalheiro de monóculo', palhaco: 'Palhaço de feira', apostador: 'Apostador' };
const STY = { foto: 'foto realista', jogo: 'render estilizado de jogo', pintado: 'pintado à mão' };
const M2D = { qwen21t: 'Qwen-Image 2.1', krea2anime: 'Krea 2 Anime' };
let data = [];

function star(key) {
  const b = document.createElement('button');
  b.className = 'star'; b.textContent = '★'; b.title = 'Favorita';
  b.setAttribute('aria-pressed', favs.has(key));
  b.onclick = () => { favs.has(key) ? favs.delete(key) : favs.add(key); b.setAttribute('aria-pressed', favs.has(key)); save(); };
  return b;
}
function render() {
  const f = document.getElementById('filtro').value;
  const only = document.getElementById('soFav').getAttribute('aria-pressed') === 'true';
  const list = document.getElementById('list'); list.innerHTML = '';
  let n = 0;
  for (const it of data) {
    const sty = it.model2d + '/' + it.style;
    if (f && f !== sty) continue;
    const keys = [it.concept, ...it.modelos.map(m => m.glb)];
    if (only && !keys.some(k => favs.has(k))) continue;
    const row = document.createElement('section'); row.className = 'row';
    row.innerHTML = `<h2>${NAMES[it.id] || it.id} <small>${M2D[it.model2d] || it.model2d} · ${STY[it.style] || it.style}${it.seconds2d ? ' · ' + Math.round(it.seconds2d) + ' s' : ''}</small></h2>`;
    const cells = document.createElement('div'); cells.className = 'cells';
    const c0 = document.createElement('div'); c0.className = 'cell';
    c0.innerHTML = `<img src="${it.concept}" alt="concept ${it.id}" loading="lazy"><div class="cap"><b>Concept 2D</b><span>${M2D[it.model2d] || ''}</span></div>`;
    c0.appendChild(star(it.concept)); cells.appendChild(c0);
    for (const m of it.modelos) {
      const c = document.createElement('div'); c.className = 'cell';
      c.innerHTML = `<model-viewer src="${m.glb}" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="20deg" shadow-intensity="0.6" exposure="1" environment-image="neutral" camera-orbit="0deg 80deg auto" loading="lazy" alt="${m.label}"></model-viewer>
        <div class="cap"><b>${m.label}</b><span>${m.faces ? (m.faces / 1000).toFixed(0) + 'k tri · ' : ''}${m.mb} MB${m.seconds ? ' · ' + Math.round(m.seconds) + ' s' : ''}</span></div>`;
      c.appendChild(star(m.glb)); cells.appendChild(c);
    }
    if (!it.modelos.length) {
      const e = document.createElement('div'); e.className = 'cell';
      e.innerHTML = '<div class="empty">3D ainda não gerado para este concept</div>'; cells.appendChild(e);
    }
    row.appendChild(cells); list.appendChild(row); n++;
  }
  document.getElementById('count').textContent = `${n} concepts · ${data.reduce((a, i) => a + i.modelos.length, 0)} modelos 3D`;
}
fetch('dados.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  data = d.items;
  const sel = document.getElementById('filtro');
  [...new Set(data.map(i => i.model2d + '/' + i.style))].forEach(s => {
    const [m, st] = s.split('/'); const o = document.createElement('option'); o.value = s; o.textContent = `${M2D[m] || m} · ${STY[st] || st}`; sel.appendChild(o);
  });
  render();
});
document.getElementById('filtro').onchange = render;
document.getElementById('soFav').onclick = e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); render(); };
document.getElementById('dark').onclick = e => { const b = e.currentTarget; const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); document.body.classList.toggle('dark', on); };
document.getElementById('copiar').onclick = () => { const p = document.getElementById('favs'); p.style.display = 'block'; p.textContent = favs.size ? [...favs].join('\n') : 'Nenhuma favorita marcada ainda.'; };
</script>
</body>
</html>
