<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { STYLES } from './fx.js';
const q = new URLSearchParams(location.search);
const img = new Image();
img.src = q.get('src');
await img.decode();
const W = img.width, H = img.height;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
ctx.drawImage(img, 0, 0);
// máscara do traço (preto = tinta), renderizada com art.html?mask=ink
const mimg = new Image();
mimg.src = q.get('mask');
await mimg.decode();
ctx.drawImage(mimg, 0, 0);
const md = ctx.getImageData(0, 0, W, H).data, ink = new Float32Array(W * H);
for (let i = 0; i < W * H; i++) ink[i] = 1 - md[i * 4] / 255;
ctx.drawImage(img, 0, 0);
const src = ctx.getImageData(0, 0, W, H);
const out = STYLES[q.get('style')](src, W, H, ink);
if (out) ctx.putImageData(out, 0, 0);
window.__done = true;
</script>
</body>
</html>
