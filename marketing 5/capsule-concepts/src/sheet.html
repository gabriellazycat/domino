<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#1a0d22;font-family:'Lilita One',sans-serif;color:#ffe28a}
  .g{display:grid;grid-template-columns:repeat(3,616px);gap:18px;padding:18px}
  figure{margin:0}
  img{width:616px;height:353px;display:block;border-radius:6px}
  figcaption{font-size:26px;padding:6px 2px 0}
</style>
</head>
<body>
<div class="g" id="g"></div>
<script>
const items = [['0-original', 'Original'], ['1-aquarela', 'Aquarela'], ['2-oleo', 'Óleo sobre tela'], ['3-pixel', 'Pixel art'], ['4-riso', 'Risografia'], ['5-xilo', 'Xilogravura'], ['6-neon', 'Neon'], ['7-giz', 'Giz na lousa'], ['8-papel', 'Papel recortado']];
document.getElementById('g').innerHTML = items.map(([f, t]) => `<figure><img src="/out/${f}.png"><figcaption>${t}</figcaption></figure>`).join('');
Promise.all([...document.images].map((i) => i.decode())).then(() => document.fonts.ready).then(() => { window.__done = true; });
</script>
</body>
</html>
