<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esboços cabeça do dono</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 35%,#3a1458 0%,#1d0a33 45%,#0a0414 100%)}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;left:0;right:0;top:12px;z-index:2;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #ui button{background:#2b1d12;color:#f1dcb4;border:1px solid #7a5a32;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  #ui button:hover{background:#4a321c}
  .tag{position:fixed;color:#f1dcb4;font-size:13px;text-align:center;transform:translate(-50%,0);pointer-events:none;text-shadow:0 1px 3px #000;white-space:nowrap;line-height:1.3}
  .tag b{display:block;font-size:22px;color:#ffcf6a}
</style>
</head>
<body>
<div id="ui"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/examples/jsm/geometries/RoundedBoxGeometry.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;
const SP = 3.9;
const HOME = { pos: new THREE.Vector3(0, -0.8, 25), tgt: new THREE.Vector3(0, -0.5, 0) };
cam.position.copy(HOME.pos); controls.target.copy(HOME.tgt);

scene.add(new THREE.HemisphereLight('#c9b8ff', '#3a1608', 0.8));
const key = new THREE.DirectionalLight('#ffe2b8', 2.2); key.position.set(3, 6, 10); scene.add(key);
const under = new THREE.PointLight('#ffb070', 70, 16, 1.4); under.position.set(0, -2.5, 6); scene.add(under);
const rimL = new THREE.PointLight('#8a4aff', 40, 20); rimL.position.set(-6, 4, -3); scene.add(rimL);

// ---------- texturas ----------
function woodMat(base, grain, { rough = 0.7, rep = 1, rings = false } = {}) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = grain; g.lineCap = 'round';
  for (let i = 0; i < 50; i++) {
    g.globalAlpha = 0.1 + Math.random() * 0.28; g.lineWidth = 0.6 + Math.random() * 2.2;
    const x = Math.random() * 256, w = (Math.random() - 0.5) * 14;
    g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + w, 80, x - w, 170, x + w * 0.4, 256); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4;
  return new THREE.MeshStandardMaterial({ map: t, roughness: rough });
}
const paint = (c, r = 0.5, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const glow = (c, i = 3) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, roughness: 0.4 });
const dark = new THREE.MeshBasicMaterial({ color: '#070304' });

function eyeTexture(iris = ['#2c4250', '#5a7c88', '#1c2830']) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#efe7d6'; g.fillRect(0, 0, 256, 128);
  const ir = g.createRadialGradient(64, 64, 6, 64, 64, 24);
  ir.addColorStop(0, iris[0]); ir.addColorStop(0.7, iris[1]); ir.addColorStop(1, iris[2]);
  g.fillStyle = ir; g.beginPath(); g.ellipse(64, 64, 22, 24, 0, 0, 7); g.fill();
  g.fillStyle = '#060404'; g.beginPath(); g.ellipse(64, 64, 9, 10, 0, 0, 7); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.12 });
}

const RB = (w, h, d, r = 0.1) => new RoundedBoxGeometry(w, h, d, 3, r);
const BX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CY = (a, b, h, s = 20) => new THREE.CylinderGeometry(a, b, h, s);
const SP_ = (r) => new THREE.SphereGeometry(r, 16, 12);
function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}

// ---------- cabeça de marionete (origem = linha da boca; frente = +Z) ----------
function makeHead(P) {
  const head = new THREE.Group();
  const W = P.W, UH = P.UH, JH = P.JH, D = P.D;
  const wood = P.wood, wood2 = P.wood2 || P.wood;
  // bloco de cima (entalhado, quinas arredondadas) e cavidade escura da boca
  add(head, RB(W, UH, D, P.r ?? 0.12), wood, 0, UH / 2, 0);
  add(head, BX(W * 0.9, 0.04, D * 0.86), dark, 0, 0.0, 0);
  // queixo articulado: dobradiça atrás
  const jaw = new THREE.Group(); jaw.position.set(0, 0, -D / 2 + 0.12); head.add(jaw);
  const jw = W * (P.jawW ?? 0.96);
  add(jaw, RB(jw, JH, D - 0.12, P.rj ?? 0.12), P.jawMat || wood, 0, -JH / 2, (D - 0.12) / 2);
  // olhos de vidro com pálpebra
  const eyeMat = eyeTexture(P.iris);
  const eyes = [];
  for (const side of [-1, 1]) {
    const eg = new THREE.Group(); eg.position.set(side * P.eyeX, UH * (P.eyeY ?? 0.55), D / 2 - 0.02); head.add(eg);
    add(eg, BX(0.5, 0.42, 0.06), P.socketMat || dark, 0, 0, -0.04); // órbita escura
    const ball = add(eg, SP_(0.2), eyeMat); ball.rotation.order = 'YXZ';
    const tilt = new THREE.Group(); eg.add(tilt);
    const lid = add(tilt, new THREE.SphereGeometry(0.218, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2), P.lidMat || wood);
    eyes.push({ ball, tilt, lid, side });
  }
  // pescoço, colarinho e gravata (o resto fica atrás da mesa)
  add(head, CY(0.36, 0.4, 0.55), P.neckMat || wood2, 0, -JH - 0.22, 0);
  add(head, CY(0.55, 0.62, 0.28, 4), paint('#d8cfba', 0.8), 0, -JH - 0.48, 0).rotation.y = Math.PI / 4;
  const bowM = paint(P.bow || '#7a1420', 0.6);
  for (const s of [-1, 1]) { const w = add(head, new THREE.ConeGeometry(0.17, 0.34, 4), bowM, s * 0.17, -JH - 0.42, D / 2 - 0.05); w.rotation.z = s * Math.PI / 2; w.scale.z = 0.5; }
  add(head, SP_(0.08), bowM, 0, -JH - 0.42, D / 2 - 0.03);
  // cordas
  const fixed = [[0, UH + 0.3, 0], [-W / 2 + 0.05, UH * 0.6, 0.1], [W / 2 - 0.05, UH * 0.6, 0.1]];
  const jawA = [-1, 1].map((s) => { const o = new THREE.Object3D(); o.position.set(s * (jw / 2 - 0.12), -JH * 0.6, D / 2 - 0.15); jaw.add(o); return o; });
  const n = 5, pos = new Float32Array(n * 6);
  fixed.forEach(([x, y, z], i) => pos.set([x, y, z, x * 1.4, 30, z - 2], i * 6));
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const strings = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#e8dfc8', transparent: true, opacity: 0.4 }));
  strings.frustumCulled = false; head.add(strings);
  P.decorate({ head, jaw, W, UH, JH, D, add, RB, BX, CY, SP_, paint, glow, dark, eyes, wood, wood2 });
  return { head, jaw, eyes, strings, jawA, P, state: { jaw: 0 } };
}

const pine = () => woodMat('#e0b573', '#8a5a26');
const walnut = () => woodMat('#5e3822', '#1f0f06');
const birch = () => woodMat('#eadfc4', '#9a8a68');
const oak = () => woodMat('#b98448', '#5a3414');
const teeth = (c, n, y, z, w, h, col = '#f1e9d2', parent = c.head, span = c.W * 0.78) => {
  const m = paint(col, 0.5);
  for (let i = 0; i < n; i++) c.add(parent, c.BX(span / n - 0.02, h, 0.06), m, -span / 2 + (span / n) * (i + 0.5), y, z);
};

// A — CUBO ENTALHADO: evolução direta do ventríloquo, cabeça de bloco de pinho pintado
function A() {
  return makeHead({
    name: 'Cubo Entalhado', desc: 'o ventríloquo atual, mas entalhado: bloco de pinho, cabelo laqueado, bochechas pintadas',
    W: 1.8, UH: 1.3, JH: 0.8, D: 1.6, eyeX: 0.44, wood: pine(), wood2: oak(), r: 0.14,
    decorate(c) {
      const { head, jaw, add, RB, BX, CY, SP_, paint, dark, W, UH, JH, D } = c;
      const hair = paint('#2a170c', 0.4, 0.1);
      add(head, RB(W + 0.1, 0.42, D + 0.08, 0.12), hair, 0, UH + 0.02, 0);
      add(head, RB(0.22, 0.7, D * 0.7, 0.06), hair, -W / 2 - 0.02, UH - 0.3, -0.1);
      add(head, RB(0.22, 0.7, D * 0.7, 0.06), hair, W / 2 + 0.02, UH - 0.3, -0.1);
      add(head, BX(0.06, 0.04, D * 0.5), dark, 0.3, UH + 0.24, 0.1); // risca
      for (const s of [-1, 1]) {
        add(head, RB(0.12, 0.5, 0.34, 0.04), c.wood2, s * (W / 2 + 0.06), UH * 0.5, -0.05); // orelha
        const ch = add(head, CY(0.2, 0.2, 0.03, 20), paint('#d65c56', 0.7), s * 0.62, UH * 0.22, D / 2 + 0.005); ch.rotation.x = Math.PI / 2;
        const br = add(head, RB(0.5, 0.09, 0.1, 0.03), paint('#2a170c', 0.5), s * 0.44, UH * 0.55 + 0.38, D / 2 + 0.02); br.rotation.z = s * 0.22;
      }
      add(head, RB(0.26, 0.34, 0.34, 0.08), paint('#d98e78', 0.4), 0, UH * 0.3, D / 2 + 0.05); // nariz de bloco
      add(head, RB(0.62, 0.09, 0.08, 0.03), paint('#8e2a26', 0.4), 0, 0.12, D / 2 + 0.03);
      add(jaw, RB(0.66, 0.09, 0.08, 0.03), paint('#8e2a26', 0.4), 0, -0.07, D - 0.16);
      teeth(c, 6, 0.04, D / 2 - 0.02, 0.1, 0.08);
    },
  });
}

// B — ROBÔ DE TÁBUAS: tábuas aparentes, cintas de ferro, grade na boca, orelhas de engrenagem
function B() {
  const iron = paint('#2a2a32', 0.35, 0.85);
  const plank = () => woodMat(['#c89a5a', '#b88a4a', '#d4a868'][Math.floor(Math.random() * 3)], '#5a3a14');
  return makeHead({
    name: 'Robô de Tábuas', desc: 'cabeça de caixa de tábuas, cintas de ferro, olhos de vidro âmbar, grade na boca',
    W: 1.8, UH: 1.3, JH: 0.8, D: 1.5, eyeX: 0.46, wood: plank(), wood2: iron, r: 0.04, rj: 0.04, jawW: 0.94,
    iris: ['#ffcf5a', '#ff9a20', '#7a3a08'], socketMat: iron, lidMat: iron, neckMat: iron, bow: '#a8161c',
    decorate(c) {
      const { head, jaw, add, BX, CY, SP_, glow, paint, W, UH, JH, D } = c;
      // costuras de tábua: ripas verticais na frente
      for (let i = 0; i < 6; i++) add(head, BX(0.012, UH, 0.01), paint('#1a0e06'), -W / 2 + (W / 6) * i + 0.0, UH / 2, D / 2 + 0.005);
      // cintas de ferro
      for (const y of [0.1, UH - 0.1]) add(head, BX(W + 0.06, 0.12, D + 0.06), iron, 0, y, 0);
      add(jaw, BX(W * 0.94 + 0.04, 0.1, D - 0.04), iron, 0, -JH + 0.06, (D - 0.12) / 2);
      // grade da boca no queixo
      for (let i = 0; i < 7; i++) add(jaw, BX(0.05, JH * 0.55, 0.04), iron, -0.54 + i * 0.18, -JH * 0.5, D - 0.13);
      // rebites
      for (const sx of [-1, 1]) for (const y of [0.1, UH - 0.1]) add(head, SP_(0.045), paint('#8a8e98', 0.3, 0.9), sx * (W / 2 - 0.1), y, D / 2 + 0.04);
      // testa: placa + antena de lâmpada
      add(head, BX(0.9, 0.1, 0.05), iron, 0, UH * 0.82, D / 2 + 0.01);
      add(head, CY(0.03, 0.03, 0.5, 6), iron, 0.45, UH + 0.25, 0);
      add(head, SP_(0.1), glow('#ff3030', 4), 0.45, UH + 0.55, 0);
      // orelhas de engrenagem
      for (const s of [-1, 1]) {
        const g = add(head, CY(0.3, 0.3, 0.1, 10), iron, s * (W / 2 + 0.08), UH * 0.5, 0); g.rotation.z = Math.PI / 2;
        add(head, CY(0.1, 0.1, 0.14, 8), glow('#ffb020', 1.6), s * (W / 2 + 0.1), UH * 0.5, 0).rotation.z = Math.PI / 2;
      }
    },
  });
}

// C — MÁSCARA RACHADA: nogueira escura, sobrancelha pesada, rachadura com brasa dentro, dentes de madeira
function C() {
  return makeHead({
    name: 'Máscara Rachada', desc: 'nogueira escura, cenho pesado, rachadura com brasa por dentro (combina com o rosto que racha a cada vitória)',
    W: 1.8, UH: 1.35, JH: 0.85, D: 1.6, eyeX: 0.46, eyeY: 0.5, wood: walnut(), wood2: woodMat('#3a2012', '#120a04'), r: 0.1,
    iris: ['#ff7a3a', '#c4260e', '#3a0a04'], bow: '#4a0e18',
    decorate(c) {
      const { head, jaw, add, RB, BX, CY, SP_, paint, glow, dark, W, UH, JH, D } = c;
      const bone = paint('#e6d8b8', 0.5);
      add(head, RB(W * 0.94, 0.24, 0.3, 0.06), c.wood2, 0, UH * 0.5 + 0.3, D / 2 - 0.02); // cenho pesado
      add(head, RB(0.3, 0.55, 0.36, 0.06), c.wood2, 0, UH * 0.3, D / 2 + 0.05); // nariz comprido
      for (const s of [-1, 1]) add(head, RB(0.5, 0.2, 0.2, 0.06), c.wood2, s * 0.62, UH * 0.22, D / 2 - 0.05); // maçãs
      teeth(c, 6, 0.06, D / 2 - 0.03, 0.1, 0.12, '#d8c8a0');
      for (let i = 0; i < 6; i++) c.add(jaw, c.BX(0.18, 0.12, 0.06), paint('#d8c8a0', 0.5), -0.5 + i * 0.2, -0.07, D - 0.16);
      // rachadura em zigue-zague na testa e na bochecha, com brasa
      const cr = paint('#0a0402', 1);
      const zig = [[0.1, 1.28], [0.18, 1.1], [0.05, 0.96], [0.14, 0.82]];
      for (let i = 0; i < zig.length - 1; i++) {
        const [x0, y0] = zig[i], [x1, y1] = zig[i + 1];
        const len = Math.hypot(x1 - x0, y1 - y0);
        const b = add(head, BX(0.035, len, 0.03), cr, (x0 + x1) / 2, (y0 + y1) / 2, D / 2 + 0.01); b.rotation.z = Math.atan2(x1 - x0, y1 - y0) * -1;
      }
      const chunk = add(head, BX(0.34, 0.3, 0.05), dark, 0.62, UH * 0.75, D / 2 + 0.005); chunk.rotation.z = 0.3; // lasca faltando
      add(head, BX(0.16, 0.12, 0.04), glow('#ff6a20', 4), 0.62, UH * 0.75, D / 2 + 0.03).rotation.z = 0.3;
      // grampos de ferro costurando a rachadura
      for (const y of [1.18, 0.93]) add(head, BX(0.16, 0.03, 0.04), paint('#6a6e78', 0.3, 0.9), 0.14, y, D / 2 + 0.03);
    },
  });
}

// D — CAVALHEIRO: bétula pálida, cartola, monóculo, bigodão e sorrisão cheio de dentes
function Dd() {
  const gold = paint('#d9a62a', 0.3, 0.85);
  return makeHead({
    name: 'Cavalheiro', desc: 'bétula clara, cartola, monóculo, bigodão e sorrisão de dentes enormes (o mais elegante e sinistro)',
    W: 1.55, UH: 1.4, JH: 0.9, D: 1.45, eyeX: 0.4, eyeY: 0.55, wood: birch(), wood2: woodMat('#cdbf9e', '#7a6a48'), r: 0.1,
    iris: ['#1c1c24', '#3a3a48', '#0a0a10'], bow: '#a8161c',
    decorate(c) {
      const { head, jaw, add, RB, BX, CY, SP_, paint, dark, W, UH, JH, D } = c;
      const black = paint('#0d0d12', 0.5);
      add(head, CY(0.95, 0.95, 0.06, 24), black, 0, UH + 0.03, 0);
      add(head, CY(0.62, 0.62, 0.95, 24), black, 0, UH + 0.52, 0);
      add(head, CY(0.63, 0.63, 0.16, 24), paint('#a8161c', 0.5), 0, UH + 0.2, 0);
      const mono = add(head, new THREE.TorusGeometry(0.26, 0.03, 8, 24), gold, 0.4, UH * 0.55, D / 2 + 0.07);
      add(head, BX(0.025, 0.7, 0.025), gold, 0.7, UH * 0.55 - 0.4, D / 2 + 0.07).rotation.z = 0.2;
      for (const s of [-1, 1]) {
        add(head, RB(0.5, 0.07, 0.07, 0.02), black, s * 0.4, UH * 0.55 + 0.35, D / 2 + 0.02).rotation.z = -s * 0.3;
        add(head, RB(0.5, 0.12, 0.1, 0.04), black, s * 0.3, UH * 0.18, D / 2 + 0.03).rotation.z = s * -0.25; // bigode
      }
      add(head, RB(0.16, 0.34, 0.25, 0.05), c.wood2, 0, UH * 0.3, D / 2 + 0.04);
      teeth(c, 9, 0.08, D / 2 - 0.02, 0.08, 0.16, '#f1e9d2', head, 1.2);
      for (let i = 0; i < 9; i++) add(jaw, BX(0.12, 0.16, 0.06), paint('#f1e9d2', 0.5), -0.6 + i * 0.15, -0.09, D - 0.16);
      add(jaw, RB(0.18, 0.3, 0.1, 0.03), black, 0, -JH * 0.75, D - 0.1); // cavanhaque
    },
  });
}

// E — DOMINÓ: a cabeça é uma pedra de dominó em pé: a linha do meio é a dobradiça do queixo
function E() {
  return makeHead({
    name: 'Cabeça de Dominó', desc: 'a cabeça é uma pedra de dominó: osso marfim, a linha do meio é a boca/queixo, bolinhas nos cantos',
    W: 1.7, UH: 1.25, JH: 1.1, D: 1.0, eyeX: 0.42, eyeY: 0.5, wood: woodMat('#efe2bc', '#b8a070'), wood2: woodMat('#cdbf9e', '#7a6a48'), r: 0.14, rj: 0.14, jawW: 1.0,
    iris: ['#10161c', '#2a3238', '#050607'], bow: '#a8161c',
    decorate(c) {
      const { head, jaw, add, BX, CY, SP_, paint, glow, W, UH, JH, D } = c;
      const pip = paint('#0a0a0a', 0.3);
      const dot = (parent, x, y, z) => { const p = add(parent, CY(0.15, 0.15, 0.03, 20), pip, x, y, z); p.rotation.x = Math.PI / 2; };
      // 4 bolinhas nos cantos: duas na testa, duas no queixo (o meio é dos olhos)
      for (const s of [-1, 1]) { dot(head, s * 0.58, UH - 0.24, D / 2 + 0.005); dot(jaw, s * 0.58, -JH + 0.28, D - 0.12 + 0.005); }
      // filete dourado em volta e na linha do meio
      const gold = paint('#d9a62a', 0.3, 0.85);
      add(head, BX(W + 0.02, 0.06, D + 0.02), gold, 0, 0.03, 0);
      add(jaw, BX(W + 0.02, 0.04, D - 0.1), gold, 0, -JH + 0.02, (D - 0.12) / 2);
      for (const s of [-1, 1]) add(head, BX(0.05, UH, 0.04), gold, s * (W / 2 - 0.02), UH / 2, D / 2 - 0.02);
      for (const s of [-1, 1]) add(jaw, BX(0.05, JH, 0.04), gold, s * (W / 2 - 0.02), -JH / 2, D - 0.16);
      // sobrancelhas de tinta e boca costurada
      for (const s of [-1, 1]) add(head, BX(0.5, 0.07, 0.04), pip, s * 0.42, UH * 0.5 + 0.35, D / 2 + 0.005).rotation.z = -s * 0.2;
      teeth(c, 7, 0.05, D / 2 - 0.02, 0.1, 0.1, '#fff6dc');
      for (let i = 0; i < 7; i++) add(jaw, BX(0.14, 0.1, 0.05), paint('#fff6dc', 0.5), -0.45 + i * 0.15, -0.06, D - 0.16);
      add(head, BX(0.12, 0.3, 0.2), c.wood2, 0, UH * 0.3, D / 2 + 0.03);
      // coroa de peças de dominó em pé (o vilão é o dono da mesa)
      for (let i = -2; i <= 2; i++) {
        const t = add(head, new THREE.BoxGeometry(0.26, 0.55, 0.1), paint('#efe2bc', 0.5), i * 0.3, UH + 0.27, 0);
        t.rotation.z = i * 0.15;
        add(head, CY(0.035, 0.035, 0.02, 8), pip, i * 0.3 + i * 0.015, UH + 0.38, 0.055).rotation.x = Math.PI / 2;
      }
    },
  });
}

// ================== VARIAÇÕES DO CUBO ENTALHADO (opção 1) ==================
const hairM = () => paint('#2a170c', 0.4, 0.1);
const redM = () => paint('#8e2a26', 0.4);
function ears(c, sz = 0.5, off = 0.06) { for (const s of [-1, 1]) c.add(c.head, c.RB(0.12, sz, 0.34, 0.04), c.wood2, s * (c.W / 2 + off), c.UH * 0.5, -0.05); }
function cheeks(c, r = 0.2, x = 0.62, y = 0.22, col = '#d65c56') { for (const s of [-1, 1]) c.add(c.head, c.CY(r, r, 0.03, 20), paint(col, 0.7), s * x, c.UH * y, c.D / 2 + 0.005).rotation.x = Math.PI / 2; }
function brows(c, x, tilt, thick = 0.09, len = 0.5, dy = 0.38, col = '#2a170c') { for (const s of [-1, 1]) c.add(c.head, c.RB(len, thick, 0.1, 0.03), paint(col, 0.5), s * x, c.UH * 0.55 + dy, c.D / 2 + 0.02).rotation.z = s * tilt; }
function nose(c, w, h, d, col = '#d98e78') { c.add(c.head, c.RB(w, h, d, 0.08), paint(col, 0.4), 0, c.UH * 0.3, c.D / 2 + d * 0.15); }
function freckles(c, n = 8) { const m = paint('#7a3c26', 0.8); for (let i = 0; i < n; i++) { const s = i % 2 ? 1 : -1; c.add(c.head, c.BX(0.04, 0.04, 0.02), m, s * (0.35 + ((i * 37) % 10) / 40), c.UH * 0.3 + ((i * 53) % 10) / 60 - 0.05, c.D / 2 + 0.005); } }
function lips(c, w = 0.62, y = 0.12, tilt = 0) { c.add(c.head, c.RB(w, 0.09, 0.08, 0.03), redM(), 0, y, c.D / 2 + 0.03).rotation.z = tilt; c.add(c.jaw, c.RB(w, 0.09, 0.08, 0.03), redM(), 0, -0.07, c.D - 0.16).rotation.z = tilt; }
const tooth = (c, n, span, h, skip = -1, col = '#f1e9d2') => { for (let i = 0; i < n; i++) { if (i === skip) continue; c.add(c.head, c.BX(span / n - 0.02, h, 0.06), paint(col, 0.5), -span / 2 + (span / n) * (i + 0.5), 0.05, c.D / 2 - 0.02); } };

// 1.2 TOPETE
function A2() {
  return makeHead({ name: '1.2 Topete', desc: 'topete laqueado de rockabilly, orelhas grandes, sorriso torto, sardas', W: 1.7, UH: 1.3, JH: 0.75, D: 1.55, eyeX: 0.42, wood: pine(), wood2: oak(), r: 0.12, tilt: 0.06,
    decorate(c) {
      const { head, jaw, add, RB, W, UH, D } = c;
      add(head, RB(W + 0.08, 0.4, D + 0.06, 0.12), hairM(), 0, UH + 0.02, 0);
      add(head, RB(0.95, 0.55, 0.85, 0.2), hairM(), 0.12, UH + 0.35, 0.3).rotation.z = -0.25; // topete
      add(head, RB(0.18, 0.5, 0.3, 0.05), hairM(), -W / 2 - 0.0, UH - 0.15, 0.1); add(head, RB(0.18, 0.5, 0.3, 0.05), hairM(), W / 2, UH - 0.15, 0.1);
      ears(c, 0.7, 0.07); freckles(c, 12); brows(c, 0.44, 0.35, 0.08, 0.46, 0.4); nose(c, 0.2, 0.3, 0.3); cheeks(c, 0.17, 0.66, 0.2);
      lips(c, 0.55, 0.12, 0.12); tooth(c, 4, 0.5, 0.08);
    } });
}
// 1.3 CARECA LARGA
function A3() {
  return makeHead({ name: '1.3 Careca Largo', desc: 'cabeça larga e baixa, careca com tufos, sobrancelha reta, nariz bolota, barba por fazer', W: 2.2, UH: 1.1, JH: 0.8, D: 1.5, eyeX: 0.58, eyeY: 0.5, wood: oak(), wood2: woodMat('#8a5a2c', '#3a2008'), r: 0.1, anger: 0.2,
    decorate(c) {
      const { head, jaw, add, RB, BX, SP_, W, UH, D } = c;
      for (const s of [-1, 1]) add(head, RB(0.4, 0.55, 0.5, 0.15), hairM(), s * (W / 2 - 0.05), UH * 0.62, -0.15);
      add(head, RB(W * 0.9, 0.17, 0.2, 0.05), hairM(), 0, UH * 0.5 + 0.34, D / 2 - 0.0);
      ears(c, 0.55, 0.06);
      const n = add(head, SP_(0.24), paint('#d9766a', 0.35), 0, UH * 0.28, D / 2 + 0.06); n.scale.set(1, 0.9, 1);
      for (let i = 0; i < 18; i++) add(jaw, BX(0.025, 0.05, 0.02), paint('#2a170c', 0.8), -0.7 + (i % 9) * 0.175, -0.25 - Math.floor(i / 9) * 0.22, c.D - 0.13);
      lips(c, 0.9, 0.12); tooth(c, 8, 0.85, 0.09); cheeks(c, 0.15, 0.9, 0.2, '#c8625a');
    } });
}
// 1.4 QUEBRA-NOZES
function A4() {
  return makeHead({ name: '1.4 Quebra-Nozes', desc: 'cabeça alta e estreita, queixo enorme, franja reta, bigode fino, dentes grandes', W: 1.45, UH: 1.5, JH: 1.05, D: 1.45, eyeX: 0.36, eyeY: 0.52, wood: woodMat('#e8c88a', '#9a6a2a'), wood2: oak(), r: 0.1, jawW: 1.06,
    decorate(c) {
      const { head, jaw, add, RB, W, UH, JH, D } = c;
      add(head, RB(W + 0.08, 0.34, D + 0.06, 0.1), hairM(), 0, UH + 0.0, 0);
      add(head, RB(W + 0.02, 0.26, 0.12, 0.04), hairM(), 0, UH - 0.2, D / 2 + 0.02); // franja reta
      ears(c, 0.5, 0.06); brows(c, 0.36, -0.15, 0.07, 0.4, 0.34); nose(c, 0.16, 0.5, 0.3); cheeks(c, 0.14, 0.5, 0.2);
      for (const s of [-1, 1]) add(head, RB(0.4, 0.07, 0.08, 0.02), hairM(), s * 0.22, UH * 0.19, D / 2 + 0.05).rotation.z = s * -0.18;
      lips(c, 0.7, 0.1); tooth(c, 5, 0.66, 0.14, 2); add(jaw, RB(W * 0.7, 0.14, 0.12, 0.04), c.wood2, 0, -JH + 0.1, D - 0.1);
    } });
}
// 1.5 CARRANCA
function A5() {
  return makeHead({ name: '1.5 Carranca', desc: 'sobrancelhas bravas, cabelo de espetos, nariz vermelho, boca de presas — o mais ameaçador', W: 1.8, UH: 1.25, JH: 0.85, D: 1.6, eyeX: 0.44, wood: oak(), wood2: woodMat('#8a5a2c', '#3a2008'), r: 0.1, anger: 1, iris: ['#8a2a1a', '#d2461a', '#3a0a04'], bow: '#4a0e18',
    decorate(c) {
      const { head, jaw, add, RB, BX, CY, SP_, W, UH, D } = c;
      for (let i = 0; i < 7; i++) { const x = -0.72 + i * 0.24; const h = 0.45 + ((i * 7) % 4) * 0.12; const s = add(head, new THREE.ConeGeometry(0.14, h, 4), hairM(), x, UH + h / 2 - 0.02, ((i % 2) - 0.5) * 0.3); s.rotation.z = (x) * -0.35; }
      add(head, RB(W + 0.06, 0.18, D + 0.04, 0.08), hairM(), 0, UH - 0.05, 0);
      ears(c, 0.55, 0.06); brows(c, 0.42, -0.5, 0.14, 0.62, 0.3, '#1a0e06');
      const n = add(head, SP_(0.17), paint('#c42a22', 0.3), 0, UH * 0.3, D / 2 + 0.08);
      cheeks(c, 0.2, 0.62, 0.2, '#9a2a24');
      add(head, RB(0.7, 0.08, 0.08, 0.03), redM(), 0, 0.1, D / 2 + 0.03); add(jaw, RB(0.7, 0.08, 0.08, 0.03), redM(), 0, -0.06, D - 0.16);
      for (const s of [-1, 1]) add(jaw, new THREE.ConeGeometry(0.07, 0.3, 4), paint('#efe5cc', 0.5), s * 0.28, 0.06, D - 0.16);
      tooth(c, 6, 0.6, 0.1);
    } });
}
// 1.6 JORNALEIRO
function A6() {
  return makeHead({ name: '1.6 Jornaleiro', desc: 'boné de feltro, orelhas de abano, sorriso banguela, bochechas gordas (o mais simpático e esquisito)', W: 1.85, UH: 1.25, JH: 0.85, D: 1.6, eyeX: 0.45, wood: pine(), wood2: oak(), r: 0.16, tilt: -0.1,
    decorate(c) {
      const { head, jaw, add, RB, W, UH, D } = c;
      add(head, RB(W + 0.14, 0.3, D + 0.1, 0.12), paint('#3a4a5a', 0.9), 0, UH + 0.12, 0);
      add(head, RB(W * 0.7, 0.07, 0.65, 0.03), paint('#2c3844', 0.9), 0.08, UH - 0.0, D / 2 + 0.3).rotation.x = 0.2; // aba
      add(head, c.CY(0.07, 0.07, 0.06, 12), paint('#c9a050', 0.4, 0.7), 0, UH + 0.3, 0);
      ears(c, 0.8, 0.12); freckles(c, 14); brows(c, 0.44, 0.15, 0.08, 0.46, 0.38); nose(c, 0.24, 0.26, 0.3, '#d9766a'); cheeks(c, 0.25, 0.68, 0.2);
      lips(c, 0.7, 0.12, -0.05); tooth(c, 6, 0.64, 0.1, 2);
    } });
}

const HEADS = [A(), A2(), A3(), A4(), A5(), A6()];
const ui = document.getElementById('ui');
const tags = [];
const ledge = new THREE.Group();
HEADS.forEach((h, i) => {
  h.head.position.set((i - 2.5) * SP, 0, 0);
  scene.add(h.head);
  // borda da mesa à frente deste, escondendo o resto do pescoço (como no jogo)
  const t = document.createElement('div'); t.className = 'tag'; t.innerHTML = `<b>${i + 1}</b>${h.P.name}<br><small>${h.P.desc}</small>`; t.style.maxWidth = '230px'; t.style.whiteSpace = 'normal'; document.body.appendChild(t); tags.push(t);
  const b = document.createElement('button'); b.textContent = `${i + 1} · ${h.P.name}`; b.onclick = () => focus(i); ui.appendChild(b);
});
// mesa
const edge = add(scene, new THREE.BoxGeometry(40, 0.9, 3), woodMat('#4a2e18', '#1a0e06', { rep: 8 }), 0, -2.55, 2.2);
add(scene, new THREE.BoxGeometry(40, 0.05, 3.1), paint('#5a3a1a', 0.6, 0.3), 0, -2.1, 2.2);
const bAll = document.createElement('button'); bAll.textContent = 'Todos'; bAll.onclick = () => focus(-1); ui.appendChild(bAll);

let goal = null;
function focus(i) {
  if (i < 0) goal = { pos: HOME.pos.clone(), tgt: HOME.tgt.clone() };
  else { const x = (i - 2.5) * SP; goal = { pos: new THREE.Vector3(x, -1.2, 6.2), tgt: new THREE.Vector3(x, 0.2, 0) }; }
}
const q = new URLSearchParams(location.search);
if (q.has('p')) focus(+q.get('p') - 1);
if (q.has('snap') && goal) { cam.position.copy(goal.pos); controls.target.copy(goal.tgt); goal = null; }

// modo captura (?shot=1): só a cabeça 1, de frente, parada, fundo liso — entrada limpa para imagem→3D
const SHOT = q.has('shot');
if (SHOT) {
  document.body.style.background = '#d4d4d4'; document.getElementById('ui').style.display = 'none';
  tags.forEach((el) => (el.style.display = 'none'));
  scene.children.forEach((o) => { if (o.isMesh) o.visible = false; });
  HEADS.forEach((h, i) => { h.strings.visible = false; if (i) h.head.visible = false; });
  hemiBoost();
  cam.position.set(0, 0.2, 8.2); controls.target.set(0, 0.0, 0); goal = null;
}
function hemiBoost() { scene.add(new THREE.AmbientLight('#ffffff', 1.2)); under.intensity = 0; rimL.intensity = 0; }
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  HEADS.forEach((h, i) => {
    const ph = i * 1.7;
    const g = h.head;
    g.position.set((i - 2.5) * SP + Math.sin(t * 0.23 + ph) * 0.12, Math.sin(t * 0.6 + ph) * 0.08, 0);
    g.rotation.y = Math.sin(t * 0.17 + ph) * 0.25;
    g.rotation.x = 0.1 + Math.sin(t * 0.4 + ph) * 0.02;
    g.rotation.z = Math.sin(t * 0.31 + ph) * 0.05 + (h.P.tilt || 0);
    const an = h.P.anger || 0;
    // olhar: um "cursor" imaginário passeando pela mesa
    const lx = Math.sin(t * 0.8 + ph) * 0.9, ly = -0.4 + Math.sin(t * 0.5 + ph) * 0.3;
    // piscada periódica + susto de vez em quando
    const cyc = (t + ph * 2) % 5; const shut = cyc < 0.18 ? 1 - Math.abs(cyc - 0.09) / 0.09 : 0;
    const wide = Math.max(0, Math.sin((t + ph) * 0.9 - 4) * 1.2 - 0.8);
    const squint = 0.2;
    let lid = -0.75 - wide * 0.45 + squint * 0.55; lid += (0.95 - lid) * shut;
    for (const e of h.eyes) {
      e.ball.rotation.y = lx * 0.5; e.ball.rotation.x = 0.12 - ly * 0.35;
      e.lid.rotation.x = lid + an * 0.3 * (1 - shut);
      e.tilt.rotation.z = e.side * an * 0.38;
    }
    // queixo falando em rajadas
    const talk = Math.max(0, Math.sin(t * 0.9 + ph * 1.3));
    let jaw = talk > 0.3 ? 0.08 + 0.32 * Math.abs(Math.sin(t * 11 + ph) * Math.sin(t * 6.3 + 1)) : 0;
    jaw = Math.max(jaw, wide * 0.35);
    h.state.jaw += (jaw - h.state.jaw) * 0.3;
    h.jaw.rotation.x = h.state.jaw;
  });
  if (SHOT) {
    const h = HEADS[0]; h.head.position.set(0, 0, 0); h.head.rotation.set(0.05, 0, 0); h.jaw.rotation.x = 0.03;
    for (const e of h.eyes) { e.ball.rotation.set(0.12, 0, 0); e.lid.rotation.x = -0.75; e.tilt.rotation.z = 0; }
  }
  scene.updateMatrixWorld(true);
  HEADS.forEach((h) => {
    const a = h.strings.geometry.getAttribute('position');
    h.jawA.forEach((o, k) => {
      o.getWorldPosition(tmp); h.head.worldToLocal(tmp);
      const j = 3 + k;
      a.setXYZ(j * 2, tmp.x, tmp.y, tmp.z); a.setXYZ(j * 2 + 1, tmp.x * 1.6, 30, tmp.z - 2);
    });
    a.needsUpdate = true;
  });
  tags.forEach((el, i) => {
    tmp2.set((i - 2.5) * SP, -3.1, 2.5).project(cam);
    el.style.left = ((tmp2.x * 0.5 + 0.5) * innerWidth) + 'px';
    el.style.top = ((-tmp2.y * 0.5 + 0.5) * innerHeight + 4) + 'px';
  });
  if (goal) { cam.position.lerp(goal.pos, 0.07); controls.target.lerp(goal.tgt, 0.07); if (cam.position.distanceTo(goal.pos) < 0.02) goal = null; }
  controls.update();
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
