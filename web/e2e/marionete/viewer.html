<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cubo 3D IA</title>
<style>html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 35%,#3a1458,#0a0414);overflow:hidden;font-family:system-ui;color:#f1dcb4}
canvas{position:fixed;inset:0}#ui{position:fixed;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
button{background:#2b1d12;color:#f1dcb4;border:1px solid #7a5a32;border-radius:8px;padding:6px 10px;cursor:pointer}#info{position:fixed;bottom:10px;left:10px;font-size:13px}</style></head>
<body><div id="ui"></div><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 100); cam.position.set(0, 0.3, 4.2);
const controls = new OrbitControls(cam, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#c9b8ff', '#3a1608', 0.9));
const key = new THREE.DirectionalLight('#ffe2b8', 2.4); key.position.set(3, 4, 6); scene.add(key);
const fill = new THREE.PointLight('#ffb070', 8, 12); fill.position.set(0, -2, 3); scene.add(fill);
const pivot = new THREE.Group(); scene.add(pivot);
const mat = new THREE.MeshStandardMaterial({ color: '#e0b573', roughness: 0.6, flatShading: q.has('flat') });
let mesh;
new GLTFLoader().load('cubo_hunyuan.glb', (g) => {
  g.scene.traverse((o) => { if (o.isMesh && !mesh) mesh = o; });
  const geo = mesh.geometry; geo.computeBoundingBox(); const b = geo.boundingBox;
  const c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3()), s = 2.0 / Math.max(sz.x, sz.y, sz.z);
  geo.translate(-c.x, -c.y, -c.z); geo.scale(s, s, s); geo.computeVertexNormals();
  // projeção frontal da imagem de entrada (enquadramento medido no render: cabeça x 290..735, y 175..820 de 1024)
  geo.computeBoundingBox(); const bb = geo.boundingBox, P = geo.attributes.position, uvs = new Float32Array(P.count * 2);
  const X0 = +(q.get('x0') ?? 290), X1 = +(q.get('x1') ?? 735), Y0 = +(q.get('y0') ?? 175), Y1 = +(q.get('y1') ?? 820);
  for (let i = 0; i < P.count; i++) {
    const fx = (P.getX(i) - bb.min.x) / (bb.max.x - bb.min.x), fy = (bb.max.y - P.getY(i)) / (bb.max.y - bb.min.y);
    uvs[i * 2] = (X0 + fx * (X1 - X0)) / 1024; uvs[i * 2 + 1] = 1 - (Y0 + fy * (Y1 - Y0)) / 1024;
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  const tex = new THREE.TextureLoader().load('cubo_frente.png'); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  mat.map = tex; mat.color.set('#ffffff');
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vON;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvON = normal;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vON;').replace('#include <map_fragment>', `
      vec4 tex = texture2D(map, vMapUv);
      float w = smoothstep(0.4, 0.8, vON.z);
      float imgY = 1.0 - vMapUv.y;
      vec3 wood = vec3(0.74, 0.45, 0.17), hair = vec3(0.025, 0.008, 0.003);
      bool isHair = imgY < 0.265 || (imgY < 0.37 && abs(vON.x) > 0.55) || (vON.z < -0.2 && imgY < 0.40);
      vec3 side = isHair ? hair : wood;
      diffuseColor.rgb *= mix(side, tex.rgb, w);`);
  };
  mesh.material = mat; mesh.position.set(0, 0, 0); mesh.rotation.set(0, 0, 0); mesh.scale.set(1, 1, 1); mesh.quaternion.identity();
  pivot.add(mesh);
  const tri = (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
  document.getElementById('info').textContent = `${tri} triângulos · ${geo.attributes.position.count} vértices`;
  window.__ready = true;
  if (q.has('ry')) pivot.rotation.y = +q.get('ry') * Math.PI / 180;
  if (q.has('wire')) { mat.wireframe = true; }
});
const ui = document.getElementById('ui');
const btn = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; ui.appendChild(b); };
btn('girar 90°', () => (pivot.rotation.y += Math.PI / 2));
btn('wireframe', () => (mat.wireframe = !mat.wireframe));
btn('flat', () => { mat.flatShading = !mat.flatShading; mat.needsUpdate = true; });
(function loop() { controls.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
</script></body></html>
